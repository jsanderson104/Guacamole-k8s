---
apiVersion: v1
kind: Namespace
metadata:
  name: guac
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-infrastructure
  labels:
    app: guacamole-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-app
  template:
    metadata:
      labels:
        app: guacamole-app
    spec:
      containers:
        # --- MariaDB Database Container ---
        - name: mariadb
          image: docker.io/jsanderson104/guacamole-mariadb-k8s
          ports:
            - containerPort: 3306
              name: db-port
          env:
            # Note: Configure proper secret management for production environments
            - name: MARIADB_ROOT_PASSWORD
              value: "change-me-in-production"

        # --- Guacamole App Container ---
        - name: guacamole-k8s
          image: docker.io/jsanderson104/guacamole-k8s:v1
          ports:
            - containerPort: 4822
              name: guacd
            - containerPort: 8080
              name: http-8080
            - containerPort: 9090
              name: http-9090
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-loadbalancer
  labels:
    app: guacamole-app
spec:
  type: LoadBalancer
  selector:
    app: guacamole-app
  ports:
    - name: mariadb
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-loadbalancer
  labels:
    app: guacamole-app
spec:
  type: LoadBalancer
  selector:
    app: guacamole-app
  ports:
    - name: guacd-port
      protocol: TCP
      port: 4822
      targetPort: 4822
    - name: web-8080
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: web-9090
      protocol: TCP
      port: 9090
      targetPort: 9090
